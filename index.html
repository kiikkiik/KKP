<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Text Analyzer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <h1>English Text Analyzer</h1>
    </header>

    <!-- Основное содержимое страницы -->
    <main>
        
        <!-- Блок ввода текста -->
        <section>
            <h2>Введите текст для анализа</h2>
            <textarea rows="10" cols="50" placeholder="Вставьте ваш текст сюда..."></textarea>
            <br><br>
            <input type="file" accept=".txt">
            <br><br>
            <button type="button">Анализировать</button>
        </section>

        <!-- Блок результатов -->
        <section>
            <h2>Результаты анализа</h2>
            <div id="results-container">
                <!-- Сюда позже будем выводить результаты через JavaScript -->
                <p>Здесь появятся результаты после нажатия кнопки.</p>
            </div>
        </section>

    </main>

    <!-- Подвал сайта -->
    <footer>
        <p>&copy; 2024 Командный проект</p>
    </footer>

</body>
</html>
